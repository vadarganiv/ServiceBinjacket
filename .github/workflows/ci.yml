name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/ServisBinjaket.sln
      - name: Verify formatting
        run: dotnet format backend/ServisBinjaket.sln --verify-no-changes --no-restore
      - name: Test
        run: dotnet test backend/ServisBinjaket.sln --configuration Release --no-restore
      - name: Report vulnerable packages
        run: dotnet list backend/ServisBinjaket.sln package --vulnerable --include-transitive --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
