services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: servis-binjaket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports — reachable only within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (ASP.NET Core) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servis-binjaket-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    volumes:
      - uploads_data:/app/uploads
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.00"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 256
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No ports — reachable only via nginx
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://backend:5000}
    container_name: servis-binjaket-frontend
    restart: unless-stopped
    environment:
      API_URL: "http://backend:5000"
      NODE_ENV: production
      WHATSAPP_PHONE: ${WHATSAPP_PHONE}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      PUBLIC_PHONE: ${PUBLIC_PHONE:-}
      PUBLIC_HOURS: ${PUBLIC_HOURS:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=64m,noexec,nosuid,nodev,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.75"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 128
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No ports — reachable only via nginx
    depends_on:
      - backend

  # ── Nginx (reverse proxy) ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: servis-binjaket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment when HTTPS is configured:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
      - nginx_webroot:/var/www/certbot
      - nginx_certs:/etc/letsencrypt:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - frontend
      - backend

  # ── Certbot (Let's Encrypt) — раскомментировать когда появится домен ─────────
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: servis-binjaket-certbot
  #   volumes:
  #     - nginx_certs:/etc/letsencrypt
  #     - nginx_webroot:/var/www/certbot
  #   entrypoint: >
  #     certbot certonly --webroot -w /var/www/certbot
  #     -d ${DOMAIN}
  #     --email ${CERTBOT_EMAIL}
  #     --agree-tos --non-interactive
  #   depends_on:
  #     - nginx

volumes:
  postgres_data:
  uploads_data:
  nginx_webroot:
  nginx_certs:
