worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time upstream=$upstream_addr '
                    'xff="$http_x_forwarded_for"';
    log_format security '$remote_addr [$time_local] host="$host" '
                        'request="$request" status=$status '
                        'referer="$http_referer" ua="$http_user_agent"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 30;
    client_max_body_size 32m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    limit_req_zone $binary_remote_addr zone=front:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $request_method $frontend_unsafe_method {
        default 1;
        GET     0;
        HEAD    0;
        OPTIONS 0;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # ── HTTP (активный конфиг — без домена) ──────────────────────────────────
    server {
        listen 80;
        server_name _;
        limit_conn addr 50;

        add_header X-Frame-Options         "DENY"                             always;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';" always;

        location ~* (^|/)(\.env|\.git|\.svn|\.hg|wp-admin|wp-login\.php|xmlrpc\.php|phpinfo\.php|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Dockerfile|docker-compose(\.[^/]+)?\.ya?ml|server-status|actuator|vendor/) {
            access_log /dev/stdout security;
            return 404;
        }

        # Загруженные файлы — отдаются напрямую nginx (быстрее, без app)
        location ^~ /uploads/ {
            if ($frontend_unsafe_method) { return 405; }
            limit_req zone=front burst=60 nodelay;
            alias /var/www/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            client_max_body_size 1m;
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location ^~ /api/v1/admin/ {
            limit_req zone=admin burst=20 nodelay;
            client_max_body_size 32m;
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Backend API
        location ^~ /api/ {
            limit_req zone=api burst=40 nodelay;
            client_max_body_size 32m;
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Auth endpoints
        location ^~ /auth/ {
            limit_req zone=auth burst=10 nodelay;
            client_max_body_size 1m;
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Health check
        location = /health {
            proxy_pass http://backend:5000/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
            access_log off;
        }

        location ^~ /_next/static/ {
            if ($frontend_unsafe_method) { return 405; }
            limit_req zone=front burst=100 nodelay;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location ^~ /_next/image {
            if ($frontend_unsafe_method) { return 405; }
            limit_req zone=front burst=60 nodelay;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Frontend (catch-all)
        location / {
            if ($frontend_unsafe_method) { return 405; }
            limit_req zone=front burst=60 nodelay;
            client_max_body_size 1m;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }


